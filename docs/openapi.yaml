openapi: 3.0.3
info:
  title: Pedidos API
  version: 1.0.0
  description: API para criar, pagar, concluir e cancelar pedidos.
  contact:
    name: Equipe Pedidos API
    url: https://github.com/@ArthurMorenoMendonca/pedidos-api
  license:
    name: UNLICENSED
    url: https://example.com/license
servers:
  - url: http://localhost:3000
    description: Execução local (docker compose up)
tags:
  - name: Pedidos
    description: Fluxo principal de pedidos
  - name: Operação
    description: Saúde e métricas
paths:
  /orders:
    post:
      tags: [Pedidos]
      operationId: createOrder
      summary: Cria um pedido
      description: Cria um pedido no estado CREATED e calcula o total em centavos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
            example:
              customerId: c1
              items:
                - sku: LIVRO-1
                  quantity: 2
                  unitPriceCents: 4500
      responses:
        '201':
          description: Pedido criado
          headers:
            Location:
              description: URL do pedido criado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Pedidos]
      operationId: listOrders
      summary: Lista pedidos
      description: Lista os pedidos em ordem de criação, com filtro opcional por status.
      parameters:
        - name: status
          in: query
          required: false
          description: Filtra pelo estado do pedido
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
  /orders/{id}:
    get:
      tags: [Pedidos]
      operationId: getOrder
      summary: Consulta um pedido
      description: Retorna um pedido pelo identificador.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/pay:
    post:
      tags: [Pedidos]
      operationId: payOrder
      summary: Paga um pedido
      description: Move o pedido de CREATED para PAID.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido pago
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /orders/{id}/complete:
    post:
      tags: [Pedidos]
      operationId: completeOrder
      summary: Conclui um pedido
      description: Move o pedido de PAID para COMPLETED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido concluído
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /orders/{id}/cancel:
    post:
      tags: [Pedidos]
      operationId: cancelOrder
      summary: Cancela um pedido
      description: Move o pedido de CREATED ou PAID para CANCELLED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Pedido cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /health:
    get:
      tags: [Operação]
      operationId: getHealth
      summary: Verifica a saúde da API
      description: Retorna ok quando a API está de pé.
      responses:
        '200':
          description: API saudável
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /metrics:
    get:
      tags: [Operação]
      operationId: getMetrics
      summary: Expõe métricas Prometheus
      description: Métricas em formato texto do Prometheus (latência HTTP e transições de pedido).
      responses:
        '200':
          description: Métricas
          content:
            text/plain:
              schema:
                type: string
components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: Identificador do pedido
      schema:
        type: string
  schemas:
    OrderStatus:
      type: string
      enum: [CREATED, PAID, COMPLETED, CANCELLED]
    OrderItem:
      type: object
      required: [sku, quantity, unitPriceCents]
      properties:
        sku:
          type: string
          example: LIVRO-1
        quantity:
          type: integer
          minimum: 1
          example: 2
        unitPriceCents:
          type: integer
          minimum: 1
          description: Preço unitário em centavos
          example: 4500
    CreateOrder:
      type: object
      required: [customerId, items]
      properties:
        customerId:
          type: string
          example: c1
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
    Order:
      type: object
      required: [id, customerId, items, status, totalCents, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          $ref: '#/components/schemas/OrderStatus'
        totalCents:
          type: integer
          description: Soma de quantity x unitPriceCents
          example: 9000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
  responses:
    BadRequest:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Pedido não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Transição de estado inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
